<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Spiral In Animation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #000;
    overflow: hidden;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    padding: 24px;
  }

  @keyframes spiralIn {
    0% {
      opacity: 0;
      transform: scale(0.3) rotate(-20deg);
    }
    20% {
      opacity: 1;
      transform: scale(1.12) rotate(6deg) scaleX(0.92) scaleY(1.06);
    }
    38% {
      transform: scale(0.94) rotate(-4deg) scaleX(1.05) scaleY(0.95);
    }
    54% {
      transform: scale(1.05) rotate(2.5deg) scaleX(0.97) scaleY(1.02);
    }
    70% {
      transform: scale(0.98) rotate(-1.5deg) scaleX(1.01) scaleY(0.99);
    }
    85% {
      transform: scale(1.01) rotate(0.5deg);
    }
    100% {
      opacity: 1;
      transform: scale(1) rotate(0deg);
    }
  }

  /* 유리 반사 */
  @keyframes glassShine {
    0%   { left: -120%; opacity: 0; }
    10%  { opacity: 1; }
    100% { left: 120%; opacity: 0; }
  }

  .card {
    position: relative;
    width: 72px;
    height: 72px;
    border-radius: 12px;
    overflow: hidden;
    background: #1a1a1a;
    opacity: 0;
    animation: spiralIn 0.7s cubic-bezier(0.25, 1, 0.5, 1) forwards;
  }

  .card::after {
    content: '';
    position: absolute;
    top: -20%;
    left: -120%;
    width: 50%;
    height: 140%;
    background: linear-gradient(
      105deg,
      transparent 20%,
      rgba(255,255,255,0.08) 30%,
      rgba(255,255,255,0.4) 45%,
      rgba(255,255,255,0.7) 50%,
      rgba(255,255,255,0.4) 55%,
      rgba(255,255,255,0.08) 70%,
      transparent 80%
    );
    transform: skewX(-15deg);
    opacity: 0;
    pointer-events: none;
    animation: glassShine 0.5s ease-in-out forwards;
  }

  .card img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .card:nth-child(1)  { animation-delay: 0.0s; }
  .card:nth-child(2)  { animation-delay: 0.08s; }
  .card:nth-child(3)  { animation-delay: 0.16s; }
  .card:nth-child(4)  { animation-delay: 0.24s; }
  .card:nth-child(5)  { animation-delay: 0.36s; }
  .card:nth-child(6)  { animation-delay: 0.44s; }
  .card:nth-child(7)  { animation-delay: 0.52s; }
  .card:nth-child(8)  { animation-delay: 0.60s; }
  .card:nth-child(9)  { animation-delay: 0.72s; }
  .card:nth-child(10) { animation-delay: 0.80s; }
  .card:nth-child(11) { animation-delay: 0.88s; }
  .card:nth-child(12) { animation-delay: 0.96s; }

  .card:nth-child(1)::after  { animation-delay: 0.35s; }
  .card:nth-child(2)::after  { animation-delay: 0.43s; }
  .card:nth-child(3)::after  { animation-delay: 0.51s; }
  .card:nth-child(4)::after  { animation-delay: 0.59s; }
  .card:nth-child(5)::after  { animation-delay: 0.71s; }
  .card:nth-child(6)::after  { animation-delay: 0.79s; }
  .card:nth-child(7)::after  { animation-delay: 0.87s; }
  .card:nth-child(8)::after  { animation-delay: 0.95s; }
  .card:nth-child(9)::after  { animation-delay: 1.07s; }
  .card:nth-child(10)::after { animation-delay: 1.15s; }
  .card:nth-child(11)::after { animation-delay: 1.23s; }
  .card:nth-child(12)::after { animation-delay: 1.31s; }

  .replay-btn {
    margin-top: 40px;
    padding: 10px 28px;
    background: #ffcc00;
    color: #000;
    border: none;
    border-radius: 30px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.2s;
  }
  .replay-btn:hover { transform: scale(1.05); }
</style>
</head>
<body>

<div class="grid" id="grid">
  <div class="card"><img src="asset_1-1.png" alt=""></div>
  <div class="card"><img src="asset_1-2.png" alt=""></div>
  <div class="card"><img src="asset_1-3.png" alt=""></div>
  <div class="card"><img src="asset_1-4.png" alt=""></div>
  <div class="card"><img src="asset_1-5.png" alt=""></div>
  <div class="card"><img src="asset_1-6.png" alt=""></div>
  <div class="card"><img src="asset_1-7.png" alt=""></div>
  <div class="card"><img src="asset_1-8.png" alt=""></div>
  <div class="card"><img src="asset_1-9.png" alt=""></div>
  <div class="card"><img src="asset_1-10.png" alt=""></div>
  <div class="card"><img src="asset_1-11.png" alt=""></div>
  <div class="card"><img src="asset_1.png" alt=""></div>
</div>

<button class="replay-btn" onclick="replay()">Replay</button>

<script>
function replay() {
  const grid = document.getElementById('grid');
  const clone = grid.cloneNode(true);
  clone.id = 'grid';
  grid.parentNode.replaceChild(clone, grid);
}
</script>

</body>
</html>
