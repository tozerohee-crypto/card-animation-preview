<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Animation Preview</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #111;
    color: #fff;
    font-family: -apple-system, 'Apple SD Gothic Neo', sans-serif;
  }

  .header {
    padding: 32px 40px 24px;
    border-bottom: 1px solid #222;
  }

  .header h1 {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .header p {
    font-size: 14px;
    color: #888;
  }

  .layout {
    display: flex;
    height: calc(100vh - 100px);
  }

  /* 사이드바 */
  .sidebar {
    width: 300px;
    min-width: 300px;
    border-right: 1px solid #222;
    padding: 16px 0;
    overflow-y: auto;
  }

  .nav-item {
    display: block;
    width: 100%;
    padding: 14px 24px;
    background: none;
    border: none;
    color: #aaa;
    font-size: 14px;
    text-align: left;
    cursor: pointer;
    transition: all 0.15s;
    border-left: 3px solid transparent;
  }

  .nav-item:hover {
    background: #1a1a1a;
    color: #fff;
  }

  .nav-item.active {
    background: #1a1a1a;
    color: #ffcc00;
    border-left-color: #ffcc00;
  }

  .nav-item .name {
    font-weight: 600;
    display: block;
    margin-bottom: 4px;
  }

  .nav-item .desc {
    font-size: 12px;
    color: #666;
    line-height: 1.4;
  }

  .nav-item.active .desc {
    color: #888;
  }

  /* 미리보기 영역 */
  .preview {
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .preview-toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 24px;
    border-bottom: 1px solid #222;
    background: #161616;
  }

  .preview-toolbar .current-name {
    font-size: 14px;
    font-weight: 600;
    color: #ddd;
    flex: 1;
  }

  .btn {
    padding: 8px 20px;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }

  .btn-replay {
    background: #ffcc00;
    color: #000;
  }
  .btn-replay:hover {
    background: #ffe066;
    transform: scale(1.03);
  }

  .btn-open {
    background: #333;
    color: #ddd;
  }
  .btn-open:hover {
    background: #444;
  }

  .preview-frame {
    flex: 1;
    min-height: 0;
    border: none;
    background: #000;
  }

  /* CSS 코드 패널 */
  .css-panel {
    border-top: 1px solid #222;
    background: #161616;
    max-height: 260px;
    overflow-y: auto;
  }

  .css-panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 24px;
    border-bottom: 1px solid #222;
    position: sticky;
    top: 0;
    background: #161616;
    z-index: 1;
  }

  .css-panel-header span {
    font-size: 12px;
    font-weight: 600;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .btn-copy {
    padding: 4px 12px;
    background: #333;
    color: #ccc;
    border: none;
    border-radius: 5px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-copy:hover { background: #444; color: #fff; }
  .btn-copy.copied { background: #2a5a2a; color: #8f8; }

  .css-code {
    padding: 12px 24px 16px;
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    font-size: 12px;
    line-height: 1.6;
    color: #ccc;
    white-space: pre;
    tab-size: 2;
  }

  .css-code .key { color: #c792ea; }
  .css-code .val { color: #82aaff; }
  .css-code .num { color: #f78c6c; }
  .css-code .com { color: #546e7a; }

  /* 태그 */
  .tags {
    display: flex;
    gap: 4px;
    margin-top: 6px;
    flex-wrap: wrap;
  }

  .tag {
    display: inline-block;
    padding: 2px 7px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 600;
  }

  .tag-motion { background: #2a1f00; color: #ffcc00; }
  .tag-effect { background: #001a2a; color: #4fc3f7; }
  .tag-impact { background: #1a002a; color: #ce93d8; }
</style>
</head>
<body>

<div class="header">
  <h1>Card Animation Preview</h1>
  <p>1912 Charm Storage — Unopened Box Detail Animations</p>
</div>

<div class="layout">
  <div class="sidebar" id="sidebar"></div>

  <div class="preview">
    <div class="preview-toolbar">
      <span class="current-name" id="currentName">—</span>
      <button class="btn btn-replay" onclick="replayAnimation()">Replay</button>
      <button class="btn btn-open" onclick="openInNewTab()">New Tab</button>
    </div>
    <iframe class="preview-frame" id="previewFrame" src=""></iframe>
    <div class="css-panel">
      <div class="css-panel-header">
        <span>CSS Keyframes</span>
        <button class="btn-copy" id="btnCopy" onclick="copyCSS()">Copy</button>
      </div>
      <div class="css-code" id="cssCode"></div>
    </div>
  </div>
</div>

<script>
const animations = [
  {
    file: 'star-stamp.html',
    name: 'Drop & Bounce',
    desc: '위에서 쫀득하게 내려오며 착지 시 찌그러짐 + puff 연기 + sparkle',
    tags: ['drop', 'puff', 'sparkle'],
    css: `/* Card Drop Animation */
@keyframes cardDrop {
  0%   { opacity: 0; transform: translateY(-500px) scaleY(1.1) scaleX(0.95); }
  25%  { opacity: 1; }
  40%  { transform: translateY(0) scaleY(0.88) scaleX(1.08); }
  55%  { transform: translateY(-6px) scaleY(1.03) scaleX(0.98); }
  70%  { transform: translateY(0) scaleY(0.97) scaleX(1.02); }
  85%  { transform: translateY(-2px) scaleY(1.01) scaleX(0.995); }
  100% { opacity: 1; transform: translateY(0) scaleY(1) scaleX(1); }
}

/* Puff Burst */
@keyframes puffBurst {
  0%   { opacity: 0; transform: scale(0); }
  25%  { opacity: 1; transform: scale(1.4); }
  100% { opacity: 0; transform: scale(0.3) translate(var(--tx), var(--ty)); }
}

/* Sparkle Flash */
@keyframes sparkleFlash {
  0%   { opacity: 0; transform: scale(0) rotate(0deg); }
  35%  { opacity: 1; transform: scale(1.3) rotate(15deg); }
  100% { opacity: 0; transform: scale(0) rotate(40deg); }
}

.card {
  animation: cardDrop 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
/* Card interval: 0.15s */`
  },
  {
    file: 'star-stamp-pop.html',
    name: 'Pop Bounce',
    desc: '뿅뿅 다이나믹한 스케일 바운스 (rotateY 플립 등장)',
    tags: ['flip', 'bounce'],
    css: `/* Card Pop Animation */
@keyframes cardPop {
  0%   { opacity: 0; transform: rotateY(90deg) scale(0); }
  30%  { opacity: 1; transform: rotateY(-10deg) scale(1.6); }
  50%  { transform: rotateY(5deg) scale(0.85); }
  65%  { transform: rotateY(-3deg) scale(1.2); }
  80%  { transform: rotateY(1deg) scale(0.95); }
  100% { opacity: 1; transform: rotateY(0deg) scale(1); }
}

.card {
  animation: cardPop 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
/* Card interval: 0.15s */`
  },
  {
    file: 'star-stamp-smooth.html',
    name: 'Smooth Pop + Glass Shine',
    desc: '부드러운 스케일 바운스 + 대각선 유리 반사 빛줄기',
    tags: ['flip', 'smooth', 'shine'],
    css: `/* Card Smooth Pop */
@keyframes cardPop {
  0%   { opacity: 0; transform: rotateY(90deg) scale(0); }
  35%  { opacity: 1; transform: rotateY(-5deg) scale(1.18); }
  55%  { transform: rotateY(2deg) scale(0.93); }
  75%  { transform: rotateY(-1deg) scale(1.05); }
  100% { opacity: 1; transform: rotateY(0deg) scale(1); }
}

/* Glass Shine Sweep */
@keyframes glassShine {
  0%   { left: -120%; opacity: 0; }
  10%  { opacity: 1; }
  100% { left: 120%; opacity: 0; }
}

.card::after {
  background: linear-gradient(105deg,
    transparent 20%,
    rgba(255,255,255,0.4) 45%,
    rgba(255,255,255,0.7) 50%,
    rgba(255,255,255,0.4) 55%,
    transparent 80%);
  transform: skewX(-15deg);
  animation: glassShine 0.5s ease-in-out forwards;
}

.card {
  animation: cardPop 0.7s cubic-bezier(0.25, 1, 0.5, 1) forwards;
}
/* Card interval: 0.08s | Shine delay: card + 0.35s */`
  },
  {
    file: 'star-stamp-puff.html',
    name: 'Drop + Puff Cloud',
    desc: '위에서 내려오며 착지 시 둥근 연기 파티클 + 반짝이 별',
    tags: ['drop', 'puff', 'sparkle'],
    css: `/* Card Drop Animation */
@keyframes cardDrop {
  0%   { opacity: 0; transform: translateY(-400px) scaleY(1.1) scaleX(0.95); }
  25%  { opacity: 1; }
  40%  { transform: translateY(0) scaleY(0.88) scaleX(1.08); }
  55%  { transform: translateY(-6px) scaleY(1.03) scaleX(0.98); }
  70%  { transform: translateY(0) scaleY(0.97) scaleX(1.02); }
  85%  { transform: translateY(-2px) scaleY(1.01) scaleX(0.995); }
  100% { opacity: 1; transform: translateY(0) scaleY(1) scaleX(1); }
}

/* Puff Burst — 7 round particles per card */
@keyframes puffBurst {
  0%   { opacity: 0; transform: scale(0); }
  25%  { opacity: 1; transform: scale(1.4); }
  100% { opacity: 0; transform: scale(0.3) translate(var(--tx), var(--ty)); }
}

/* Sparkle — 5 stars per card */
@keyframes sparkleFlash {
  0%   { opacity: 0; transform: scale(0) rotate(0deg); }
  35%  { opacity: 1; transform: scale(1.3) rotate(15deg); }
  100% { opacity: 0; transform: scale(0) rotate(40deg); }
}

.card {
  animation: cardDrop 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
/* Card interval: 0.15s */`
  },
  {
    file: 'star-stamp-shine.html',
    name: 'Smooth Pop + Sparkle + Shine',
    desc: '부드러운 바운스 + 유리 반사 + 카드별 4각 반짝이 별',
    tags: ['flip', 'sparkle', 'shine'],
    css: `/* Card Smooth Pop */
@keyframes cardPop {
  0%   { opacity: 0; transform: rotateY(90deg) scale(0); }
  35%  { opacity: 1; transform: rotateY(-5deg) scale(1.18); }
  55%  { transform: rotateY(2deg) scale(0.93); }
  75%  { transform: rotateY(-1deg) scale(1.05); }
  100% { opacity: 1; transform: rotateY(0deg) scale(1); }
}

/* Glass Shine Sweep */
@keyframes glassShine {
  0%   { left: -120%; opacity: 0; }
  10%  { opacity: 1; }
  100% { left: 120%; opacity: 0; }
}

/* Sparkle — 4 stars per card (lg/md/sm) */
@keyframes sparkleFlash {
  0%   { opacity: 0; transform: scale(0) rotate(0deg); }
  35%  { opacity: 1; transform: scale(1.3) rotate(15deg); }
  100% { opacity: 0; transform: scale(0) rotate(40deg); }
}

.card {
  animation: cardPop 0.7s cubic-bezier(0.25, 1, 0.5, 1) forwards;
}
/* Card interval: 0.08s | Shine: card + 0.35s | Sparkle: card + 0.2s */`
  },
  {
    file: 'star-stamp-thud.html',
    name: 'Smooth Pop + Stamp Thud',
    desc: '커졌다가 쿵! 도장 찍듯 납작해지며 안착 + 유리 반사',
    tags: ['flip', 'thud', 'shine'],
    css: `/* Card Pop + Stamp Thud */
@keyframes cardPop {
  0%   { opacity: 0; transform: rotateY(90deg) scale(0); }
  30%  { opacity: 1; transform: rotateY(-5deg) scale(1.18); }
  /* THUD — squash on impact */
  42%  { transform: rotateY(0) scale(1) scaleY(0.82) scaleX(1.12); }
  52%  { transform: rotateY(0) scale(1) scaleY(1.06) scaleX(0.97); }
  65%  { transform: rotateY(0) scale(1) scaleY(0.97) scaleX(1.02); }
  80%  { transform: rotateY(0) scale(1) scaleY(1.01) scaleX(0.995); }
  100% { opacity: 1; transform: rotateY(0) scale(1); }
}

/* Glass Shine Sweep */
@keyframes glassShine {
  0%   { left: -120%; opacity: 0; }
  10%  { opacity: 1; }
  100% { left: 120%; opacity: 0; }
}

.card {
  animation: cardPop 0.7s cubic-bezier(0.25, 1, 0.5, 1) forwards;
}
/* Card interval: 0.08s | Shine delay: card + 0.35s */`
  },
  {
    file: 'star-stamp-spiral.html',
    name: 'Spiral In + Shine',
    desc: '살짝 회전하며 쫀득하게 등장 + 유리 반사 빛줄기',
    tags: ['spin', 'bounce', 'shine'],
    css: `/* Spiral In Animation */
@keyframes spiralIn {
  0%   { opacity: 0; transform: scale(0.3) rotate(-20deg); }
  20%  { opacity: 1; transform: scale(1.12) rotate(6deg) scaleX(0.92) scaleY(1.06); }
  38%  { transform: scale(0.94) rotate(-4deg) scaleX(1.05) scaleY(0.95); }
  54%  { transform: scale(1.05) rotate(2.5deg) scaleX(0.97) scaleY(1.02); }
  70%  { transform: scale(0.98) rotate(-1.5deg) scaleX(1.01) scaleY(0.99); }
  85%  { transform: scale(1.01) rotate(0.5deg); }
  100% { opacity: 1; transform: scale(1) rotate(0deg); }
}

/* Glass Shine Sweep */
@keyframes glassShine {
  0%   { left: -120%; opacity: 0; }
  10%  { opacity: 1; }
  100% { left: 120%; opacity: 0; }
}

.card {
  animation: spiralIn 0.7s cubic-bezier(0.25, 1, 0.5, 1) forwards;
}
/* Card interval: 0.08s | Shine delay: card + 0.35s */`
  },
  {
    file: 'star-stamp-flip.html',
    name: 'Flip Reveal + Shine',
    desc: 'X축으로 카드 뒤집기 (앞면 공개) + 유리 반사 효과',
    tags: ['flip-x', 'shine'],
    css: `/* Flip Reveal Animation (rotateX) */
@keyframes flipReveal {
  0%   { opacity: 0; transform: rotateX(180deg) scale(0.7) translateY(30px); }
  40%  { opacity: 1; transform: rotateX(-15deg) scale(1.08) translateY(-8px); }
  60%  { transform: rotateX(8deg) scale(0.96) translateY(3px); }
  80%  { transform: rotateX(-3deg) scale(1.02) translateY(-1px); }
  100% { opacity: 1; transform: rotateX(0deg) scale(1) translateY(0); }
}

/* Glass Shine Sweep */
@keyframes glassShine {
  0%   { left: -120%; opacity: 0; }
  10%  { opacity: 1; }
  100% { left: 120%; opacity: 0; }
}

.card {
  animation: flipReveal 0.65s cubic-bezier(0.25, 1, 0.5, 1) forwards;
}
/* Card interval: 0.08s | Shine delay: card + 0.35s */`
  },
  {
    file: 'star-stamp-elastic.html',
    name: 'Elastic Slide',
    desc: '좌우에서 탄성 있게 슬라이드 (홀수행 왼쪽, 짝수행 오른쪽)',
    tags: ['slide', 'elastic'],
    css: `/* Elastic Slide from Left */
@keyframes elasticSlide {
  0%   { opacity: 0; transform: translateX(-200px) scaleX(1.3) scaleY(0.8); }
  30%  { opacity: 1; transform: translateX(18px) scaleX(0.9) scaleY(1.08); }
  50%  { transform: translateX(-10px) scaleX(1.05) scaleY(0.96); }
  68%  { transform: translateX(5px) scaleX(0.98) scaleY(1.02); }
  82%  { transform: translateX(-2px) scaleX(1.01) scaleY(0.995); }
  100% { opacity: 1; transform: translateX(0) scaleX(1) scaleY(1); }
}

/* Elastic Slide from Right (even rows) */
@keyframes elasticSlideRight {
  0%   { opacity: 0; transform: translateX(200px) scaleX(1.3) scaleY(0.8); }
  30%  { opacity: 1; transform: translateX(-18px) scaleX(0.9) scaleY(1.08); }
  50%  { transform: translateX(10px) scaleX(1.05) scaleY(0.96); }
  68%  { transform: translateX(-5px) scaleX(0.98) scaleY(1.02); }
  82%  { transform: translateX(2px) scaleX(1.01) scaleY(0.995); }
  100% { opacity: 1; transform: translateX(0) scaleX(1) scaleY(1); }
}

.card {
  animation: elasticSlide 0.65s cubic-bezier(0.25, 1, 0.5, 1) forwards;
}
/* Card interval: 0.06s | Row gap: 0.12s */`
  },
  {
    file: 'star-stamp-wobble.html',
    name: 'Pop Up + Wobble + Shine',
    desc: '아래에서 톡 튀어오르며 좌우 흔들림 + 유리 반사 빛줄기',
    tags: ['bounce', 'spin', 'shine'],
    css: `/* Pop Up + Wobble Animation */
@keyframes popWobble {
  0%   { opacity: 0; transform: translateY(60px) scale(0.4) rotate(0deg); }
  20%  { opacity: 1; transform: translateY(-10px) scale(1.1) rotate(-6deg); }
  35%  { transform: translateY(4px) scale(0.95) rotate(4deg); }
  50%  { transform: translateY(-3px) scale(1.04) rotate(-2.5deg); }
  65%  { transform: translateY(1px) scale(0.98) rotate(1.5deg); }
  80%  { transform: translateY(-1px) scale(1.01) rotate(-0.5deg); }
  100% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
}

/* Glass Shine Sweep */
@keyframes glassShine {
  0%   { left: -120%; opacity: 0; }
  10%  { opacity: 1; }
  100% { left: 120%; opacity: 0; }
}

.card {
  animation: popWobble 0.7s cubic-bezier(0.25, 1, 0.5, 1) forwards;
}
/* Card interval: 0.08s | Shine delay: card + 0.35s */`
  }
];

const tagStyles = {
  drop: 'tag-motion',
  flip: 'tag-motion',
  bounce: 'tag-motion',
  smooth: 'tag-motion',
  spin: 'tag-motion',
  'flip-x': 'tag-motion',
  slide: 'tag-motion',
  elastic: 'tag-motion',
  puff: 'tag-effect',
  sparkle: 'tag-effect',
  shine: 'tag-effect',
  thud: 'tag-impact'
};

let currentFile = '';
let currentCSS = '';

function buildSidebar() {
  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = '';

  animations.forEach((anim, i) => {
    const btn = document.createElement('button');
    btn.className = 'nav-item' + (i === 0 ? ' active' : '');
    btn.dataset.file = anim.file;

    const tagsHtml = anim.tags.map(t =>
      `<span class="tag ${tagStyles[t] || ''}">${t}</span>`
    ).join('');

    btn.innerHTML = `
      <span class="name">${i + 1}. ${anim.name}</span>
      <span class="desc">${anim.desc}</span>
      <div class="tags">${tagsHtml}</div>
    `;

    btn.addEventListener('click', () => selectAnimation(anim, btn));
    sidebar.appendChild(btn);
  });
}

function selectAnimation(anim, btn) {
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  btn.classList.add('active');

  currentFile = anim.file;
  currentCSS = anim.css || '';
  document.getElementById('currentName').textContent = anim.name;
  document.getElementById('previewFrame').src = anim.file;
  document.getElementById('cssCode').textContent = currentCSS;
  document.getElementById('btnCopy').textContent = 'Copy';
  document.getElementById('btnCopy').classList.remove('copied');
}

function replayAnimation() {
  const frame = document.getElementById('previewFrame');
  frame.src = '';
  setTimeout(() => { frame.src = currentFile; }, 50);
}

function openInNewTab() {
  if (currentFile) window.open(currentFile, '_blank');
}

function copyCSS() {
  if (!currentCSS) return;
  navigator.clipboard.writeText(currentCSS).then(() => {
    const btn = document.getElementById('btnCopy');
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = 'Copy';
      btn.classList.remove('copied');
    }, 2000);
  });
}

// 초기 로드
buildSidebar();
selectAnimation(animations[0], document.querySelector('.nav-item'));
</script>

</body>
</html>
