<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Reveal Animation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #000;
    overflow: hidden;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    padding: 24px;
  }

  /* 카드 등장 애니메이션 — 뒤집히며 나타남 */
  @keyframes cardReveal {
    0% {
      opacity: 0;
      transform: rotateY(90deg) scale(0.6);
      filter: brightness(2.5) blur(3px);
    }
    50% {
      opacity: 1;
      filter: brightness(1.5) blur(0px);
    }
    75% {
      transform: rotateY(-8deg) scale(1.05);
    }
    100% {
      opacity: 1;
      transform: rotateY(0deg) scale(1);
      filter: brightness(1);
    }
  }

  /* 카드 기본 */
  .card {
    width: 72px;
    height: 72px;
    border-radius: 12px;
    overflow: hidden;
    background: #1a1a1a;
    opacity: 0;
    perspective: 600px;
    animation: cardReveal 0.45s cubic-bezier(0.34, 1.4, 0.64, 1) forwards;
  }

  .card img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  /* 스태거 딜레이 — 행 사이 0.05s 추가 */
  .card:nth-child(1)  { animation-delay: 0.0s; }
  .card:nth-child(2)  { animation-delay: 0.15s; }
  .card:nth-child(3)  { animation-delay: 0.3s; }
  .card:nth-child(4)  { animation-delay: 0.45s; }
  .card:nth-child(5)  { animation-delay: 0.65s; }
  .card:nth-child(6)  { animation-delay: 0.8s; }
  .card:nth-child(7)  { animation-delay: 0.95s; }
  .card:nth-child(8)  { animation-delay: 1.1s; }
  .card:nth-child(9)  { animation-delay: 1.3s; }
  .card:nth-child(10) { animation-delay: 1.45s; }
  .card:nth-child(11) { animation-delay: 1.6s; }
  .card:nth-child(12) { animation-delay: 1.75s; }

  /* 리플레이 */
  .replay-btn {
    margin-top: 40px;
    padding: 10px 28px;
    background: #ffcc00;
    color: #000;
    border: none;
    border-radius: 30px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.2s;
  }
  .replay-btn:hover { transform: scale(1.05); }
</style>
</head>
<body>

<div class="grid" id="grid">
  <div class="card"><img src="asset_1-1.png" alt=""></div>
  <div class="card"><img src="asset_1-2.png" alt=""></div>
  <div class="card"><img src="asset_1-3.png" alt=""></div>
  <div class="card"><img src="asset_1-4.png" alt=""></div>
  <div class="card"><img src="asset_1-5.png" alt=""></div>
  <div class="card"><img src="asset_1-6.png" alt=""></div>
  <div class="card"><img src="asset_1-7.png" alt=""></div>
  <div class="card"><img src="asset_1-8.png" alt=""></div>
  <div class="card"><img src="asset_1-9.png" alt=""></div>
  <div class="card"><img src="asset_1-10.png" alt=""></div>
  <div class="card"><img src="asset_1-11.png" alt=""></div>
  <div class="card"><img src="asset_1.png" alt=""></div>
</div>

<button class="replay-btn" onclick="replay()">Replay</button>

<script>
function replay() {
  const grid = document.getElementById('grid');
  const clone = grid.cloneNode(true);
  clone.id = 'grid';
  grid.parentNode.replaceChild(clone, grid);
}
</script>

</body>
</html>
