<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Smooth Pop + Shine Animation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #000;
    overflow: hidden;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    padding: 24px;
  }

  @keyframes cardPop {
    0% {
      opacity: 0;
      transform: rotateY(90deg) scale(0);
    }
    35% {
      opacity: 1;
      transform: rotateY(-5deg) scale(1.18);
    }
    55% {
      transform: rotateY(2deg) scale(0.93);
    }
    75% {
      transform: rotateY(-1deg) scale(1.05);
    }
    100% {
      opacity: 1;
      transform: rotateY(0deg) scale(1);
    }
  }

  /* 유리 반사 빛줄기 */
  @keyframes glassShine {
    0% {
      left: -120%;
      opacity: 0;
    }
    10% {
      opacity: 1;
    }
    100% {
      left: 120%;
      opacity: 0;
    }
  }

  /* 반짝이 별 — 카드 등장 시 뿅 나타남 */
  @keyframes sparkleFlash {
    0% {
      opacity: 0;
      transform: scale(0) rotate(0deg);
    }
    35% {
      opacity: 1;
      transform: scale(1.3) rotate(15deg);
    }
    100% {
      opacity: 0;
      transform: scale(0) rotate(40deg);
    }
  }

  .card-wrapper {
    position: relative;
    width: 72px;
    height: 72px;
  }

  .card {
    position: relative;
    width: 72px;
    height: 72px;
    border-radius: 12px;
    overflow: hidden;
    background: #1a1a1a;
    opacity: 0;
    z-index: 1;
    animation: cardPop 0.7s cubic-bezier(0.25, 1, 0.5, 1) forwards;
  }

  .card::after {
    content: '';
    position: absolute;
    top: -20%;
    left: -120%;
    width: 50%;
    height: 140%;
    background: linear-gradient(
      105deg,
      transparent 20%,
      rgba(255, 255, 255, 0.08) 30%,
      rgba(255, 255, 255, 0.4) 45%,
      rgba(255, 255, 255, 0.7) 50%,
      rgba(255, 255, 255, 0.4) 55%,
      rgba(255, 255, 255, 0.08) 70%,
      transparent 80%
    );
    transform: skewX(-15deg);
    opacity: 0;
    pointer-events: none;
    animation: glassShine 0.5s ease-in-out forwards;
  }

  .card img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  /* 반짝이 별 */
  .sparkle {
    position: absolute;
    z-index: 2;
    opacity: 0;
    pointer-events: none;
  }
  .sparkle::before {
    content: '';
    display: block;
    background: white;
    clip-path: polygon(50% 0%, 60% 35%, 100% 50%, 60% 65%, 50% 100%, 40% 65%, 0% 50%, 40% 35%);
  }
  .sparkle.lg::before { width: 14px; height: 14px; }
  .sparkle.md::before { width: 10px; height: 10px; }
  .sparkle.sm::before { width: 7px; height: 7px; }

  /* 카드별 sparkle 위치 */
  .sparkle:nth-child(2) { top: -14px; left: 50%; }
  .sparkle:nth-child(3) { top: 15%; right: -16px; }
  .sparkle:nth-child(4) { bottom: -12px; left: 25%; }
  .sparkle:nth-child(5) { top: 50%; left: -14px; }

  /* ====== 카드 타이밍 ====== */
  .card-wrapper:nth-child(1)  .card { animation-delay: 0.0s; }
  .card-wrapper:nth-child(2)  .card { animation-delay: 0.08s; }
  .card-wrapper:nth-child(3)  .card { animation-delay: 0.16s; }
  .card-wrapper:nth-child(4)  .card { animation-delay: 0.24s; }
  .card-wrapper:nth-child(5)  .card { animation-delay: 0.36s; }
  .card-wrapper:nth-child(6)  .card { animation-delay: 0.44s; }
  .card-wrapper:nth-child(7)  .card { animation-delay: 0.52s; }
  .card-wrapper:nth-child(8)  .card { animation-delay: 0.60s; }
  .card-wrapper:nth-child(9)  .card { animation-delay: 0.72s; }
  .card-wrapper:nth-child(10) .card { animation-delay: 0.80s; }
  .card-wrapper:nth-child(11) .card { animation-delay: 0.88s; }
  .card-wrapper:nth-child(12) .card { animation-delay: 0.96s; }

  /* 유리 반사 딜레이 (카드 등장 + 0.35s) */
  .card-wrapper:nth-child(1)  .card::after { animation-delay: 0.35s; }
  .card-wrapper:nth-child(2)  .card::after { animation-delay: 0.43s; }
  .card-wrapper:nth-child(3)  .card::after { animation-delay: 0.51s; }
  .card-wrapper:nth-child(4)  .card::after { animation-delay: 0.59s; }
  .card-wrapper:nth-child(5)  .card::after { animation-delay: 0.71s; }
  .card-wrapper:nth-child(6)  .card::after { animation-delay: 0.79s; }
  .card-wrapper:nth-child(7)  .card::after { animation-delay: 0.87s; }
  .card-wrapper:nth-child(8)  .card::after { animation-delay: 0.95s; }
  .card-wrapper:nth-child(9)  .card::after { animation-delay: 1.07s; }
  .card-wrapper:nth-child(10) .card::after { animation-delay: 1.15s; }
  .card-wrapper:nth-child(11) .card::after { animation-delay: 1.23s; }
  .card-wrapper:nth-child(12) .card::after { animation-delay: 1.31s; }

  /* 반짝이 딜레이 (카드 등장 + 0.2s ~ 0.4s 스태거) */
  .card-wrapper:nth-child(1)  .sparkle:nth-child(2) { animation: sparkleFlash 0.45s ease-out 0.20s forwards; }
  .card-wrapper:nth-child(1)  .sparkle:nth-child(3) { animation: sparkleFlash 0.45s ease-out 0.28s forwards; }
  .card-wrapper:nth-child(1)  .sparkle:nth-child(4) { animation: sparkleFlash 0.45s ease-out 0.35s forwards; }
  .card-wrapper:nth-child(1)  .sparkle:nth-child(5) { animation: sparkleFlash 0.45s ease-out 0.24s forwards; }

  .card-wrapper:nth-child(2)  .sparkle:nth-child(2) { animation: sparkleFlash 0.45s ease-out 0.28s forwards; }
  .card-wrapper:nth-child(2)  .sparkle:nth-child(3) { animation: sparkleFlash 0.45s ease-out 0.36s forwards; }
  .card-wrapper:nth-child(2)  .sparkle:nth-child(4) { animation: sparkleFlash 0.45s ease-out 0.43s forwards; }
  .card-wrapper:nth-child(2)  .sparkle:nth-child(5) { animation: sparkleFlash 0.45s ease-out 0.32s forwards; }

  .card-wrapper:nth-child(3)  .sparkle:nth-child(2) { animation: sparkleFlash 0.45s ease-out 0.36s forwards; }
  .card-wrapper:nth-child(3)  .sparkle:nth-child(3) { animation: sparkleFlash 0.45s ease-out 0.44s forwards; }
  .card-wrapper:nth-child(3)  .sparkle:nth-child(4) { animation: sparkleFlash 0.45s ease-out 0.51s forwards; }
  .card-wrapper:nth-child(3)  .sparkle:nth-child(5) { animation: sparkleFlash 0.45s ease-out 0.40s forwards; }

  .card-wrapper:nth-child(4)  .sparkle:nth-child(2) { animation: sparkleFlash 0.45s ease-out 0.44s forwards; }
  .card-wrapper:nth-child(4)  .sparkle:nth-child(3) { animation: sparkleFlash 0.45s ease-out 0.52s forwards; }
  .card-wrapper:nth-child(4)  .sparkle:nth-child(4) { animation: sparkleFlash 0.45s ease-out 0.59s forwards; }
  .card-wrapper:nth-child(4)  .sparkle:nth-child(5) { animation: sparkleFlash 0.45s ease-out 0.48s forwards; }

  .card-wrapper:nth-child(5)  .sparkle:nth-child(2) { animation: sparkleFlash 0.45s ease-out 0.56s forwards; }
  .card-wrapper:nth-child(5)  .sparkle:nth-child(3) { animation: sparkleFlash 0.45s ease-out 0.64s forwards; }
  .card-wrapper:nth-child(5)  .sparkle:nth-child(4) { animation: sparkleFlash 0.45s ease-out 0.71s forwards; }
  .card-wrapper:nth-child(5)  .sparkle:nth-child(5) { animation: sparkleFlash 0.45s ease-out 0.60s forwards; }

  .card-wrapper:nth-child(6)  .sparkle:nth-child(2) { animation: sparkleFlash 0.45s ease-out 0.64s forwards; }
  .card-wrapper:nth-child(6)  .sparkle:nth-child(3) { animation: sparkleFlash 0.45s ease-out 0.72s forwards; }
  .card-wrapper:nth-child(6)  .sparkle:nth-child(4) { animation: sparkleFlash 0.45s ease-out 0.79s forwards; }
  .card-wrapper:nth-child(6)  .sparkle:nth-child(5) { animation: sparkleFlash 0.45s ease-out 0.68s forwards; }

  .card-wrapper:nth-child(7)  .sparkle:nth-child(2) { animation: sparkleFlash 0.45s ease-out 0.72s forwards; }
  .card-wrapper:nth-child(7)  .sparkle:nth-child(3) { animation: sparkleFlash 0.45s ease-out 0.80s forwards; }
  .card-wrapper:nth-child(7)  .sparkle:nth-child(4) { animation: sparkleFlash 0.45s ease-out 0.87s forwards; }
  .card-wrapper:nth-child(7)  .sparkle:nth-child(5) { animation: sparkleFlash 0.45s ease-out 0.76s forwards; }

  .card-wrapper:nth-child(8)  .sparkle:nth-child(2) { animation: sparkleFlash 0.45s ease-out 0.80s forwards; }
  .card-wrapper:nth-child(8)  .sparkle:nth-child(3) { animation: sparkleFlash 0.45s ease-out 0.88s forwards; }
  .card-wrapper:nth-child(8)  .sparkle:nth-child(4) { animation: sparkleFlash 0.45s ease-out 0.95s forwards; }
  .card-wrapper:nth-child(8)  .sparkle:nth-child(5) { animation: sparkleFlash 0.45s ease-out 0.84s forwards; }

  .card-wrapper:nth-child(9)  .sparkle:nth-child(2) { animation: sparkleFlash 0.45s ease-out 0.92s forwards; }
  .card-wrapper:nth-child(9)  .sparkle:nth-child(3) { animation: sparkleFlash 0.45s ease-out 1.00s forwards; }
  .card-wrapper:nth-child(9)  .sparkle:nth-child(4) { animation: sparkleFlash 0.45s ease-out 1.07s forwards; }
  .card-wrapper:nth-child(9)  .sparkle:nth-child(5) { animation: sparkleFlash 0.45s ease-out 0.96s forwards; }

  .card-wrapper:nth-child(10) .sparkle:nth-child(2) { animation: sparkleFlash 0.45s ease-out 1.00s forwards; }
  .card-wrapper:nth-child(10) .sparkle:nth-child(3) { animation: sparkleFlash 0.45s ease-out 1.08s forwards; }
  .card-wrapper:nth-child(10) .sparkle:nth-child(4) { animation: sparkleFlash 0.45s ease-out 1.15s forwards; }
  .card-wrapper:nth-child(10) .sparkle:nth-child(5) { animation: sparkleFlash 0.45s ease-out 1.04s forwards; }

  .card-wrapper:nth-child(11) .sparkle:nth-child(2) { animation: sparkleFlash 0.45s ease-out 1.08s forwards; }
  .card-wrapper:nth-child(11) .sparkle:nth-child(3) { animation: sparkleFlash 0.45s ease-out 1.16s forwards; }
  .card-wrapper:nth-child(11) .sparkle:nth-child(4) { animation: sparkleFlash 0.45s ease-out 1.23s forwards; }
  .card-wrapper:nth-child(11) .sparkle:nth-child(5) { animation: sparkleFlash 0.45s ease-out 1.12s forwards; }

  .card-wrapper:nth-child(12) .sparkle:nth-child(2) { animation: sparkleFlash 0.45s ease-out 1.16s forwards; }
  .card-wrapper:nth-child(12) .sparkle:nth-child(3) { animation: sparkleFlash 0.45s ease-out 1.24s forwards; }
  .card-wrapper:nth-child(12) .sparkle:nth-child(4) { animation: sparkleFlash 0.45s ease-out 1.31s forwards; }
  .card-wrapper:nth-child(12) .sparkle:nth-child(5) { animation: sparkleFlash 0.45s ease-out 1.20s forwards; }

  .replay-btn {
    margin-top: 40px;
    padding: 10px 28px;
    background: #ffcc00;
    color: #000;
    border: none;
    border-radius: 30px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.2s;
  }
  .replay-btn:hover { transform: scale(1.05); }
</style>
</head>
<body>

<div class="grid" id="grid">
  <div class="card-wrapper">
    <div class="card"><img src="asset_1-1.png" alt=""></div>
    <div class="sparkle lg"></div><div class="sparkle md"></div><div class="sparkle sm"></div><div class="sparkle md"></div>
  </div>
  <div class="card-wrapper">
    <div class="card"><img src="asset_1-2.png" alt=""></div>

  </div>
  <div class="card-wrapper">
    <div class="card"><img src="asset_1-3.png" alt=""></div>

  </div>
  <div class="card-wrapper">

  <div class="card-wrapper">

  </div>
  <div class="card-wrapper">

  </div>
  <div class="card-wrapper">
    <div class="card"><img src="asset_1-7.png" alt=""></div>
    <div class="sparkle lg"></div><div class="sparkle md"></div><div class="sparkle sm"></div><div class="sparkle md"></div>
  </div>
  <div class="card-wrapper">
    <div class="card"><img src="asset_1-8.png" alt=""></div>
    <div class="sparkle lg"></div><div class="sparkle md"></div><div class="sparkle sm"></div><div class="sparkle md"></div>

  <div class="card-wrapper">

  </div>
</div>

<button class="replay-btn" onclick="replay()">Replay</button>

<script>
function replay() {
  const grid = document.getElementById('grid');
  const clone = grid.cloneNode(true);
  clone.id = 'grid';
  grid.parentNode.replaceChild(clone, grid);
}
</script>

</body>
</html>
